# A Linux VM for building the Mu-Silicium UEFI: its Basetools are shipped for Linux and
# Windows only, so the UEFI step cannot run on macOS itself (docs: uefi/README.md).
arch: "aarch64"
cpus: 6
memory: "8GiB"
disk: "40GiB"
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
mounts:
  - location: "/Users/jrace/Downloads/hackios-xnu-kernel-main"
    writable: true
