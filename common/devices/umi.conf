# Xiaomi Mi 10 (umi) -- Snapdragon 865, SM8250 "kona".
NAME="Xiaomi Mi 10 (umi)"
KIND=phone
SOC="Qualcomm Snapdragon 865 (SM8250)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# Mu-Silicium has no "umi" yet: the port starts from "citrus" (POCO F3 / Redmi K40, also SM8250,
# KamortaPkg) -- see docs/PORTING.md step 1. Until that tree exists these point at prebuilt/uefi.
UEFI_TARGET=umi
UEFI_FD=/Users/jrace/Downloads/hackios-xnu-kernel-main/Mu-Silicium/Build/umiPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
DTB=umi.dtb
# From alioth (Resources/Configs/alioth.toml), the other SM8250 "kona" device: same SoC,
# same memory map. Its MemoryMapLib puts "Display Reserved" at 0x9C000000 -- the address the
# phone's own device tree uses for cont_splash_region, which confirms the match.
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000

# --- kernel and loader -----------------------------------------------------------------------------
# read from the phone's device tree: reserved-memory/cont_splash_region@9c000000, 0x2300000 bytes
FB_BASE=0x9C000000
WIFI_ATH11K=0                   # WCN3990 is ath10k, not ath11k: the wifi/lx layer does not cover it

# --- what the run needs ----------------------------------------------------------------------------
# cores 0-3 are A55 (capacity-dmips-mhz 1024), 4-7 are A77 (1894): boot on a big one
BOOTARGS="touchscreen=1 cpus=8 bootcpu=7"
DEFAULT_SECS=900
USERLAND_VARS=""
# taken from the phone's Android with adb (see README.md, "On the phone")
FIRMWARE="fw-gpu fw-wifi fw-audio fw-haptic"
